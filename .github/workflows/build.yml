
name: HEX-AI Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build HEX-AI
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compiler HEX-AI
        run: gradle assembleDebug --stacktrace

      - name: Verifier le fichier APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Publier l'APK comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: HEX-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Creer une release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}-${{ github.run_attempt }}"
          gh release create "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            --title "HEX-AI - Build ${{ github.run_number }}" \
            --notes "APK de test HEX-AI, genere automatiquement par GitHub Actions." \
            --latest
